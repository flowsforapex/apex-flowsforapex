  execution: 
    sequence: 20
    event-scope: Static
    type: Immediate

  when: 
    event: After Refresh
    selection-type: Region
    region: Started Activities # 16803577815123703

  actions: 
  - # ====== Action: Refresh Prism ===============================
    id: 21786099948192743
    identification: 
      name: Refresh Prism
      action: Execute JavaScript Code

    settings: 
      code: |
        Prism.highlightAll();
        apex.event.trigger("body", "apexwindowresized");

    affected-elements: 
      selection-type: Region
      region: 'Started Ad Hoc Activities ' # 20042766778654206

    execution: 
      sequence: 20
      event: Started Activities Report Refreshed # 22454301098378831
      fire-when-event-result-is: True
      fire-on-initialization: false

  - # ====== Action: Execute JavaScript Code =====================
    id: 22454751270378839
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        $("td[headers*=started-adhoc-activities-status-col]").each(function () {
          var statusText = $(this).text().trim().toLowerCase();
          var statusSlug = statusText.replace(/\s+/g, "-");
          var className = "ffa-color--" + statusSlug;
          $(this).addClass(className);
        });
        

    affected-elements: 
      selection-type: Region
      region: Started Activities # 16803577815123703

    execution: 
      sequence: 10
      event: Started Activities Report Refreshed # 22454301098378831
      fire-when-event-result-is: True
      fire-on-initialization: true

