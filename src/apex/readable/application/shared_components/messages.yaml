  message: 
    text: 이렇게 하면 현재 단계 또는 해당 변수 표현식을 실행하지 않고 프로세스 인스턴스가 다음 단계로 이동하게 됩니다. 이 단계에서 설정해야 하는 프로세스 변수를 수동으로 확인하고 설정합니다. 설명을 추가하고(선택사항) 확인을 누르십시오.

