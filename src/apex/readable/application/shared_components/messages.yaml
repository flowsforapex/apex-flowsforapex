- # ====== Text Message: APP_CONFIRM_FORCE_NEXT_STEP ===========
  id: 30097152040538896
  identification: 
    name: APP_CONFIRM_FORCE_NEXT_STEP

  message: 
    text: これにより、現在のステップや変数式を実行せずに、プロセス・インスタンスが強制的に次のステップに移動します。このステップで設定する必要があるプロセス変数を手動でチェックおよび設定します。コメント(オプション)を追加して、「確認」をクリックしてください。

  attributes: 
    language: Japanese (ja)
    used-in-javascript: true

  subscription: 
    version-number: 8572727114

- # ====== Text Message: APP_CONFIRM_REPOSITION_SUBFLOW ========
  id: 30097247987538896
  identification: 
    name: APP_CONFIRM_REPOSITION_SUBFLOW

  message: 
    text: 現在のサブフローを前のプロセス・ステップに再配置します。すべてのステップが有効な宛先ではありません。リストから実行可能なステップを選択し、コメント(オプション)を追加して、「サブフローの再配置」を押して続行します。

  attributes: 
    language: Japanese (ja)
    used-in-javascript: true

  subscription: 
    version-number: 8572727114

